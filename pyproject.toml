[project]
name = "pdf"
version = "0.1.0"
description = "PDF (President Driven Finances) — event-study pipeline analyzing Donald Trump's Truth Social activity and cryptocurrency market reactions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
ingestion = [
    "fsspec>=2024.10",
    "httpx>=0.27",
    "pyarrow>=18.0",
    "pydantic-settings>=2.6",
]
etl = []
ai = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
ingest = "ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "etl", "ai"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
